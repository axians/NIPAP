{% extends "base.html" %}
{% block content %}
<div style="max-width: 640px; margin: 48px auto; padding: 32px; border: 1px solid #ddd; border-radius: 6px;">
    <h1>Audit access required</h1>
    <p>{{ message }}</p>
    {% if session.get('user') %}
    <p><a href="{{ url_for('prefix.list') }}">Back to prefixes</a></p>
    {% else %}
    <p><a href="{{ url_for('auth.login') }}">Log in</a> if you already have access.</p>
    {% endif %}
</div>
{% endblock %}
